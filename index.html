<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />

    <!--
      SEO and link previews (WhatsApp, Facebook, LinkedIn, Telegram, Slack, X).
      This is an SPA: crawlers don't run JS, so these tags are what every shared link shows.
      URLs must be absolute. og-image.png is 1200×630 (rendered from the e-ink design).
    -->
    <title>Prologue · Project Log Gue</title>
    <meta
      name="description"
      content="Prologue is a dashboard for developers to keep track of their projects: where the code lives, where it runs, which Version is out, and what work is left."
    />
    <link rel="canonical" href="https://prologue-app.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prologue" />
    <meta property="og:url" content="https://prologue-app.vercel.app/" />
    <meta property="og:title" content="Prologue · Project Log Gue" />
    <meta
      property="og:description"
      content="Every project, one ledger. Where the code lives, where it runs, which Version is out, and what work is left."
    />
    <meta property="og:image" content="https://prologue-app.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://prologue-app.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Prologue: every project, one ledger, with Environments, Versions and Tasks done." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prologue · Project Log Gue" />
    <meta
      name="twitter:description"
      content="Every project, one ledger. Where the code lives, where it runs, which Version is out, and what work is left."
    />
    <meta name="twitter:image" content="https://prologue-app.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Prologue: every project, one ledger, with Environments, Versions and Tasks done." />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash. Mirrors src/theme/ThemeProvider.tsx.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('prologue-theme') || '{}')
          var mode = saved.mode || 'system'
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
